# Builds the Riverboat 21 apps in the cloud. Copy this file to .github/workflows/build-apps.yml
# (GitHub → Add file → Create new file → paste), then: Actions → "Build apps" → Run workflow.
# Download the results from the finished run's "Artifacts" section.
name: Build apps
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [both, android, ios]
        default: both
      make_keystore:
        description: 'Android, first time only: create the signing key for Google Play'
        type: boolean
        default: false

jobs:
  # ---------- Android: one-time signing key ----------
  keystore:
    if: ${{ inputs.make_keystore }}
    runs-on: ubuntu-latest
    steps:
      - name: Create upload key
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Riverboat 21, O=Dashlith"
          mkdir out
          base64 -w0 upload.jks > out/ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "$PASS" > out/ANDROID_KEYSTORE_PASSWORD.txt
          printf 'upload' > out/ANDROID_KEY_ALIAS.txt
      - uses: actions/upload-artifact@v4
        with: { name: android-signing-key-SAVE-THIS, path: out, retention-days: 1 }

  # ---------- Android: APK (+ AAB for Google Play when a key is set) ----------
  android:
    if: ${{ !inputs.make_keystore && inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    env:
      RB21_API: ${{ vars.API_URL || 'https://riverboat21.onrender.com' }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Prepare Android project
        working-directory: mobile
        run: npm install --no-audit --no-fund && npm run android:prepare
      - name: Build
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/Riverboat21.apk"
            cp app/build/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/out/Riverboat21-google-play.aab"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/Riverboat21.apk"
          fi
          ls -l "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with: { name: Riverboat21-android, path: out }

  # ---------- iOS: TestFlight upload (with Apple keys) or unsigned .ipa (without) ----------
  ios:
    if: ${{ !inputs.make_keystore && inputs.platform != 'android' }}
    runs-on: macos-15
    env:
      RB21_API: ${{ vars.API_URL || 'https://riverboat21.onrender.com' }}
      ADMOB_APP_ID_IOS: ${{ vars.ADMOB_APP_ID_IOS }}
      BUILD_NUMBER: ${{ github.run_number }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Prepare iOS project
        working-directory: mobile
        run: npm install --no-audit --no-fund && npm run ios:prepare
      - name: Build
        working-directory: mobile/ios/App
        run: |
          set -eo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          COMMON="-project App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS"
          if [ -n "$ASC_KEY_P8" ] && [ -n "$IOS_TEAM_ID" ]; then
            echo "Apple keys found: signed build + upload to TestFlight"
            KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; printf '%s' "$ASC_KEY_P8" > "$KEY"
            AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
            xcodebuild $COMMON -archivePath build/App.xcarchive archive $AUTH \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Automatic \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="1.0.$BUILD_NUMBER"
            cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export $AUTH
            echo "Uploaded build 1.0.$BUILD_NUMBER to App Store Connect. It appears in TestFlight after Apple finishes processing (10-30 min)." | tee "$GITHUB_WORKSPACE/out/README.txt"
          else
            echo "No Apple keys: building an unsigned .ipa (install with Sideloadly/AltStore)"
            xcodebuild $COMMON -sdk iphoneos -derivedDataPath build build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="1.0.$BUILD_NUMBER"
            mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
            zip -qry "$GITHUB_WORKSPACE/out/Riverboat21-unsigned.ipa" Payload
          fi
          ls -l "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with: { name: Riverboat21-ios, path: out }
